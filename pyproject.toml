# Ruff（リント・フォーマット）の設定。comken 本体と揃える。
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".pytest-tmp", ".pytest-*", "_scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "LOG", "G", "DTZ", "RUF", "TID"]
ignore = [
    # 日本語のコード・コメント・docstring を「紛らわしい文字」として大量に誤検知するため
    "RUF001", "RUF002", "RUF003",
    # __all__ は意味のまとまり順に並べているため、アルファベット順の強制は受け入れない
    "RUF022",
]

[tool.ruff.lint.flake8-bugbear]
# column() は dataclasses.field() を返すので、dataclass のデフォルトに置いてよい
# （呼び出しの結果を共有してしまう「可変デフォルト」には当たらない）。
# 移設済みの `comken.toolbox.master_table.column()` は既に存在しないため
# Ruff B008 が誤検知する。`src.report_master.column` を許可リストに明示する。
extend-immutable-calls = ["src.report_master.column"]

[tool.ruff.lint.flake8-tidy-imports]
# 相対 import は禁止。ドットを数える作業を残さないため。
# 必ず `from comken.X import Y` のようにパッケージルートから書く（CONVENTIONS.md 参照）
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
# 分岐の絡み合いの上限。
# 10 は「いま全部通る一番きつい値」。測ったら最大が 10 だったので、
# これ以上ややこしくなった時点で落ちる。
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# テストは assert のための仮実装・cleanup の try/except が読みやすさ優先で残るため、
# bugbear 系（try/except/Pass 等）の警告を抑止する。
"tests/**" = ["B017", "SIM105"]

[tool.pyright]
# 開発時は隣接するcomkenリポジトリを直接参照する。実行環境ではPYTHON_LIBRARYを使う。
# src/ はプロジェクトルートからの絶対 import（`src.service` 等）で参照するため、
# ルート自身もパスに含める。
extraPaths = [".", "../comken"]
